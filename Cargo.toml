[workspace]
resolver = "2"
members = [
    "src/blf",
    "src/view",
    "src/parser",
]

[workspace.dependencies]
ashpd = { version = "0.8", default-features = false, features = ["tokio"] }
font-kit = { version = "0.14", default-features = false }

[patch.crates-io]
# Use Zed's font-kit fork which uses core-graphics 0.24.0
# This matches core-text > 20 but we need to pin core-text to 20.x or 21.0.0 if 21.1.0 broke it
font-kit = { git = "https://github.com/zed-industries/font-kit", branch = "master" }
