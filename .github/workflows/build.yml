name: Build

on:
  push:
    branches: [ main, dev, 'feat/**' ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build and test (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TARGET: x86_64-pc-windows-msvc
      ASSET_NAME: candata-windows-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so `git describe` can stamp the version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2

      - name: Show Rust version
        run: |
          rustc --version
          cargo --version

      - name: Run cargo clippy
        run: cargo clippy --workspace --target ${{ env.TARGET }} -- -W clippy::all

      - name: Run tests
        run: cargo test --workspace --target ${{ env.TARGET }}

      - name: Build release binary
        run: cargo build --release -p candata --target ${{ env.TARGET }}

      - name: Create archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force upload | Out-Null
          Copy-Item "target/${{ env.TARGET }}/release/candata.exe" upload/
          Compress-Archive -Path upload/candata.exe -DestinationPath "${{ env.ASSET_NAME }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_NAME }}.zip
          retention-days: 30
