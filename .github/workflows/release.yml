name: Release

on:
  push:
    tags:
      - 'v*'  # runs when a v* tag is pushed, e.g. v1.0.0
  workflow_dispatch:  # allow manual runs

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so `git describe` can stamp the version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release -p candata

      - name: Get version from tag
        id: get_version
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="dev"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create ZIP package
        shell: pwsh
        run: |
          .\scripts\package.ps1 -Version "${{ steps.get_version.outputs.VERSION }}"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Create installer
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          .\scripts\build-installer.ps1 -Version "${{ steps.get_version.outputs.VERSION }}" -InnoSetupPath "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: release-package/*.zip

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer-output/*.exe

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: CANdata v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## CANdata v${{ steps.get_version.outputs.VERSION }}

            CANdata runs on Windows 10 and 11 (x64).

            - **Installer:** `candata-Setup-v${{ steps.get_version.outputs.VERSION }}.exe` (recommended)
            - **Portable:** `candata-v${{ steps.get_version.outputs.VERSION }}.zip`

            Commit: ${{ github.sha }}
          files: |
            installer-output/*.exe
            release-package/*.zip
          draft: false
          prerelease: false
