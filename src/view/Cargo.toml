[package]
name = "candata"
version = "1.0.0"
edition = "2024"

# CANdata is a Windows-only application.

[dependencies]
# runtime_shaders: compile GPU shaders when the app starts instead of at build time.
gpui = { git = "https://github.com/zed-industries/zed", features = ["runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
anyhow = "1.0"
blf = { path = "../blf" }
parser = { path = "../parser" }
chrono = "0.4" # For timestamp formatting
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
smol = "2"
# Native file and message dialogs.
rfd = { version = "0.14", default-features = false, features = ["tokio"] }
# Native window restore (gpui has no restore call on Windows); same versions gpui uses.
raw-window-handle = "0.6"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.3"

[build-dependencies]
winres = "0.1"

[[bin]]
name = "candata"
path = "src/main.rs"

# Windows executable metadata
[package.metadata.winres]
OriginalFilename = "candata.exe"
ProductName = "CANdata"
FileDescription = "CAN/LIN Bus Analysis Tool"
